name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in bin/*.mjs scripts/*.mjs scripts/lib/*.mjs tests/*.mjs; do
            node --check "$f"
          done

      - name: CLI help
        run: node bin/demo-reel.mjs help

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and rendering regression tests
        run: npm test
