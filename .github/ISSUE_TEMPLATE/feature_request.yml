name: Feature request
description: Suggest a new action, output format or workflow.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the launch / demo workflow, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like demo-reel to do?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / Playwright
        - Rendering / ffmpeg
        - Story format
        - CLI
        - Docs
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first
